[package]
name = "osd-probe"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["whxtelxs"]
repository = "https://github.com/Open-Stream-Deck/Firmware-Requests"
description = "Собирает сведения о деке для запроса прошивки Open Stream Deck"
publish = false

[dependencies]
nusb = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(not(windows))'.dependencies]
hidapi = "2.6"

[profile.release]
strip = true
codegen-units = 1
lto = true
opt-level = "z"
